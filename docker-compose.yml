version: '3.8'

services:
  # PostgreSQL - Main database (production-grade)
  postgres:
    image: postgres:15-alpine
    container_name: eureka-postgres
    environment:
      POSTGRES_DB: eureka_db
      POSTGRES_USER: eureka_user
      POSTGRES_PASSWORD: eureka_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eureka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eureka_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend - React app served by nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - eureka-network
    restart: unless-stopped

  # Backend - FastAPI application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    volumes:
      - eureka-data:/app/data
      - eureka-logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://eureka_user:eureka_password_change_me@postgres:5432/eureka_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-eureka_password_change_me}
      - CHROMADB_PATH=./data/chromadb
      - UPLOAD_DIR=./data/uploads
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DEBUG=${DEBUG:-false}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-auto}
      - GENERATION_MODEL=${GENERATION_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-2048}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=*
      - ALLOWED_HOSTS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started
    networks:
      - eureka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis - For caching and future Celery support
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eureka-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Neo4j - Knowledge Graph database
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-eureka_password_change_me}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    networks:
      - eureka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  eureka-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  eureka-data:
    driver: local
  eureka-logs:
    driver: local
  redis-data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
